{% load static %}

<nav
    class="navbar navbar-expand-lg navbar-dark ftco_navbar bg-dark ftco-navbar-light"
    id="ftco-navbar"
>
    <div class="container">

        <a
            class="navbar-brand"
            href="{% url 'index' %}"
        >
            <span class="flaticon-pizza-1 mr-1"></span>
            La Piazza
            <br>
            <small>Delicioso</small>
        </a>

        <button
            class="navbar-toggler"
            type="button"
            data-toggle="collapse"
            data-target="#ftco-nav"
            aria-controls="ftco-nav"
            aria-expanded="false"
            aria-label="Abrir menu"
        >
            <span class="oi oi-menu"></span>
            Menu
        </button>

        <div
            class="collapse navbar-collapse"
            id="ftco-nav"
        >
            <ul class="navbar-nav ml-auto">

                <li class="nav-item">
                    <a
                        href="{% url 'index' %}"
                        class="nav-link"
                    >
                        Início
                    </a>
                </li>

                <li class="nav-item">
                    <a
                        href="{% url 'menu' %}"
                        class="nav-link"
                    >
                        Cardápio
                    </a>
                </li>

                <li class="nav-item">
                    <a
                        href="{% url 'sobre' %}"
                        class="nav-link"
                    >
                        Sobre
                    </a>
                </li>

                {% if user.is_authenticated %}

                    <li class="nav-item">
                        <span class="nav-link">
                            Olá,
                            {{ user.first_name|default:user.username }}
                        </span>
                    </li>

                    <li class="nav-item d-flex align-items-center">
                        <form
                            method="post"
                            action="{% url 'usuarios:logout' %}"
                            class="m-0"
                        >
                            {% csrf_token %}

                            <button
                                type="submit"
                                class="btn btn-link nav-link border-0"
                            >
                                Sair
                            </button>
                        </form>
                    </li>

                {% else %}

                    <li class="nav-item">
                        <a
                            href="{% url 'usuarios:login' %}"
                            class="nav-link"
                        >
                            Entrar
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            href="{% url 'usuarios:cadastro' %}"
                            class="nav-link"
                        >
                            Criar conta
                        </a>
                    </li>

                {% endif %}

            </ul>
        </div>

    </div>
</nav>
