{% extends "_management_base.html" %}


{% block title %}
Página não encontrada | La Piazza
{% endblock %}


{% block content %}

<section
    class="lp-card lp-reveal"
    style="
        max-width:700px;
        margin:70px auto;
        text-align:center;
        padding:60px 35px;
    "
>

    <div
        style="
            width:80px;
            height:80px;
            margin:0 auto 22px;
            display:grid;
            place-items:center;
            border-radius:24px;
            background:rgba(217,121,65,.1);
            color:var(--lp-primary-light);
            font-size:34px;
        "
    >

        <i class="bi bi-compass"></i>

    </div>


    <div
        style="
            color:var(--lp-primary-light);
            font-size:11px;
            text-transform:uppercase;
            letter-spacing:1.5px;
            font-weight:700;
        "
    >
        Erro 404
    </div>


    <h1
        style="
            margin:8px 0;
            font-family:'Playfair Display',serif;
            color:var(--lp-cream);
        "
    >
        Página não encontrada
    </h1>


    <p
        style="
            max-width:480px;
            margin:0 auto 28px;
            color:var(--lp-muted);
            line-height:1.7;
        "
    >

        O endereço acessado não existe ou pode
        ter sido removido.

    </p>


    <a
        href="{% url 'index' %}"
        class="btn btn-primary"
    >

        <i class="bi bi-house"></i>

        Ir para o início

    </a>

</section>

{% endblock %}
