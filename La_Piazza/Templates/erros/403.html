{% extends "_management_base.html" %}


{% block title %}
Acesso negado | La Piazza
{% endblock %}


{% block content %}

<section
    class="lp-card lp-reveal"
    style="
        max-width:700px;
        margin:70px auto;
        text-align:center;
        padding:60px 35px;
    "
>

    <div
        style="
            width:80px;
            height:80px;
            margin:0 auto 22px;
            display:grid;
            place-items:center;
            border-radius:24px;
            background:rgba(211,95,95,.1);
            color:#df7777;
            font-size:34px;
        "
    >

        <i class="bi bi-shield-lock"></i>

    </div>


    <div
        style="
            color:var(--lp-primary-light);
            font-size:11px;
            text-transform:uppercase;
            letter-spacing:1.5px;
            font-weight:700;
        "
    >
        Erro 403
    </div>


    <h1
        style="
            margin:8px 0;
            font-family:'Playfair Display',serif;
            color:var(--lp-cream);
        "
    >
        Acesso não autorizado
    </h1>


    <p
        style="
            max-width:480px;
            margin:0 auto 28px;
            color:var(--lp-muted);
            line-height:1.7;
        "
    >

        Sua conta está autenticada, mas não possui
        permissão para acessar esta área do sistema.

    </p>


    <a
        href="{% url 'index' %}"
        class="btn btn-primary"
    >

        <i class="bi bi-house"></i>

        Voltar ao início

    </a>

</section>

{% endblock %}
