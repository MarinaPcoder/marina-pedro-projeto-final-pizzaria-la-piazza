{% extends "_gerencia_base.html" %}

{% block title %}Excluir endereço | La Piazza{% endblock %}

{% block content %}
<section class="ftco-section">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-7">
        <div class="lp-card text-center">
          <span class="subheading">Confirmação</span>
          <h2>Excluir endereço</h2>
          <p>Deseja excluir <strong>{{ endereco }}</strong> de {% firstof endereco.usuario.get_full_name endereco.usuario.username %}?</p>
          <form method="post">
            {% csrf_token %}
            <a href="{% url 'usuarios_gerenciamento:endereco_detalhe' endereco.pk %}" class="btn btn-secondary mr-2">Cancelar</a>
            <button type="submit" class="btn btn-danger">Excluir</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
